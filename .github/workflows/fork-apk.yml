name: 📱 Fork APK

# Builds the Android phone APK of this fork and publishes it as a GitHub
# release, so it installs from one fixed link on the phone instead of a zipped
# Actions artifact that needs a GitHub login and expires after a week.
#
# - A push to develop rebuilds the "apk-develop" release.
# - "Run workflow" on the Actions tab builds any branch, a pull request's
#   branch say, into its own "apk-<branch>" release.
#
# The APK is signed with the debug keystore Expo's prebuild template ships,
# the same on every build, so a new APK installs over the previous one. It is
# not the Play Store signature: the Play Store app has to be uninstalled once
# before the first install.

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_GIT_BRANCH: ${{ github.ref_name }}
  EXPO_PUBLIC_GIT_COMMIT: ${{ github.sha }}
  EXPO_PUBLIC_GIT_RUN_NUMBER: ${{ github.run_number }}

jobs:
  apk:
    # Upstream builds its own APKs in build-apps.yml; this one is for forks.
    if: github.repository != 'streamyfin/streamyfin'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    name: 🤖 Build and publish the APK
    permissions:
      contents: write # create the release and upload the APK

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          show-progress: false
          persist-credentials: false

      - name: 🗑️ Free Disk Space
        uses: BRAINSia/free-disk-space@7048ffbf50819342ac964ef3998a51c2564a8a75 # v2.1.3
        with:
          tool-cache: false
          mandb: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # renovate: datasource=npm depName=bun
          bun-version: "1.4.4"

      - name: ☕ Set up JDK 17
        # ubuntu-26.04 defaults to JDK 25, which breaks the RN/AGP native build.
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: 💾 Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: 💾 Cache Gradle global
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradle-

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🛠️ Generate project files
        run: bun run prebuild

      - name: 🚀 Build APK
        env:
          EXPO_TV: 0
          # Phones only: arm64 keeps the APK small and the build short.
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        run: bun run build:android:local

      - name: 📤 Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # One release per branch, replaced on every build: its download link
          # stays the same and always serves the latest APK.
          slug=$(echo "$BRANCH" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')
          tag="apk-$slug"
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$apk" streamyfin.apk

          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          url="https://github.com/$GH_REPO/releases/download/$tag/streamyfin.apk"
          printf 'Android phone APK of `%s` at %s, built by run #%s.\n\nInstall on the phone: %s\n' \
            "$BRANCH" "${SHA:0:7}" "$GITHUB_RUN_NUMBER" "$url" > notes.md
          gh release create "$tag" streamyfin.apk \
            --target "$SHA" \
            --prerelease \
            --title "APK: $BRANCH" \
            --notes-file notes.md

          echo "### 📱 [Download the APK]($url)" >> "$GITHUB_STEP_SUMMARY"
